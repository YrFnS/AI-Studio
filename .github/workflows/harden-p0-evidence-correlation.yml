name: Harden P0 evidence correlation

on:
  push:
    branches:
      - agent/p0-runtime-integrity

permissions:
  contents: write

concurrency:
  group: p0-evidence-correlation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out runtime-integrity branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-runtime-integrity
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Apply evidence correlation hardening
        run: node scripts/harden-p0-evidence-correlation.mjs

      - name: Remove one-time migration tooling
        run: |
          git rm -f \
            .github/workflows/harden-p0-evidence-correlation.yml \
            scripts/harden-p0-evidence-correlation.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build standalone app
        run: bun run build:app

      - name: Commit evidence hardening
        run: |
          if git diff --quiet; then
            echo "No evidence hardening changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "harden P0 evidence duplicate detection"
          git push origin HEAD:agent/p0-runtime-integrity
