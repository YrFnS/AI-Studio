name: Apply route safety migration

on:
  push:
    branches:
      - agent/p0-runtime-integrity

permissions:
  contents: write

concurrency:
  group: apply-route-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out registry branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-runtime-integrity
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Apply route safety migration
        run: |
          node scripts/apply-generation-route-safety-followup.mjs
          node scripts/fix-image-input-lookup.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build standalone app
        run: bun run build:app

      - name: Commit route safety migration
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/generate/handlers.ts \
            src/components/studio/image-upload.tsx \
            src/components/studio/video-studio.tsx \
            src/components/studio/image-studio.tsx \
            src/lib/server/image-input.ts
          git commit -m "Enforce route safety in handlers and browser uploads"
          git push origin HEAD:agent/p0-runtime-integrity
