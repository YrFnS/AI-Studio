name: Refresh Bun lockfile

on:
  push:
    branches:
      - agent/stabilize-generation-gallery
    paths:
      - .github/workflows/refresh-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/stabilize-generation-gallery

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Regenerate lockfile
        run: bun install --lockfile-only

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh bun lockfile"
          git push origin HEAD:agent/stabilize-generation-gallery
