name: Temporary AI Studio stabilization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Apply and validate stabilization
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set +e

          head_message="$(git log -1 --pretty=%B)"
          if [[ "$head_message" == *"[stabilized]"* ]] || [[ "$head_message" == *"[stabilization-failed]"* ]]; then
            echo 'Stabilization runner already completed for this head commit.'
            exit 0
          fi

          cat scripts/stabilize_parts/part-* > scripts/stabilize_ai_studio.py
          : > stabilization-validation.log

          echo '=== Patch ===' >> stabilization-validation.log
          python3 -m py_compile scripts/stabilize_ai_studio.py >> stabilization-validation.log 2>&1
          compile_status=$?
          if [ "$compile_status" -eq 0 ]; then
            python3 scripts/stabilize_ai_studio.py >> stabilization-validation.log 2>&1
            patch_status=$?
          else
            patch_status=1
          fi

          install_status=1
          test_status=1
          typecheck_status=1
          lint_status=1
          build_status=1

          if [ "$patch_status" -eq 0 ]; then
            echo '=== Install ===' >> stabilization-validation.log
            bun install >> stabilization-validation.log 2>&1
            install_status=$?
          fi

          if [ "$install_status" -eq 0 ]; then
            echo '=== Tests ===' >> stabilization-validation.log
            bun test >> stabilization-validation.log 2>&1
            test_status=$?

            echo '=== Typecheck ===' >> stabilization-validation.log
            bun run typecheck >> stabilization-validation.log 2>&1
            typecheck_status=$?

            echo '=== Lint ===' >> stabilization-validation.log
            bun run lint >> stabilization-validation.log 2>&1
            lint_status=$?

            echo '=== Build ===' >> stabilization-validation.log
            bun run build >> stabilization-validation.log 2>&1
            build_status=$?
          fi

          echo "compile=$compile_status patch=$patch_status install=$install_status test=$test_status typecheck=$typecheck_status lint=$lint_status build=$build_status" >> stabilization-validation.log

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$compile_status" -ne 0 ] || [ "$patch_status" -ne 0 ] || [ "$install_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$typecheck_status" -ne 0 ] || [ "$lint_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            git add -f stabilization-validation.log
            git commit -m 'chore: record stabilization failure [stabilization-failed]'
            git push origin "HEAD:${TARGET_BRANCH}"
            exit 1
          fi

          rm -rf scripts/stabilize_parts scripts/stabilize_ai_studio.py stabilization-validation.log
          git add -A
          git commit -m 'stabilize generation and gallery workflows [stabilized]'
          git push origin "HEAD:${TARGET_BRANCH}"
