name: Apply cancellation and recovery migration

on:
  push:
    branches:
      - agent/p0-runtime-integrity

permissions:
  contents: write

concurrency:
  group: cancellation-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out runtime-integrity branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-runtime-integrity
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Apply cancellation and recovery migration
        run: node scripts/apply-cancellation-recovery.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build standalone app
        run: bun run build:app

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No cancellation and recovery changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add provider cancellation and visible recovery"
          git push origin HEAD:agent/p0-runtime-integrity
