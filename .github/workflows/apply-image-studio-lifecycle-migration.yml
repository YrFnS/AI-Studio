name: Apply Image Studio lifecycle migration

on:
  push:
    branches:
      - agent/p0-runtime-integrity
    paths:
      - scripts/apply-image-studio-lifecycle-migration.mjs
      - .github/workflows/apply-image-studio-lifecycle-migration.yml

permissions:
  contents: write

concurrency:
  group: image-studio-lifecycle-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Normalize nested template expressions in the one-time codemod
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-image-studio-lifecycle-migration.mjs')
          source = path.read_text()
          source = source.replace(
              "    const computedSize = \\\\`${'${dimensions.width}'}x${'${dimensions.height}'}\\\\`;",
              "    const computedSize = String(dimensions.width) + 'x' + String(dimensions.height);",
          )
          source = source.replace(
              "          ? \\\\`${'${result.urls.length}'} images generated successfully!\\\\`",
              "          ? String(result.urls.length) + ' images generated successfully!'",
          )
          path.write_text(source)
          PY

      - name: Apply Image Studio lifecycle migration
        run: node scripts/apply-image-studio-lifecycle-migration.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build standalone app
        run: bun run build:app

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio/image-studio.tsx src/lib/image-studio-lifecycle.test.ts
          if git diff --cached --quiet; then
            echo "No Image Studio lifecycle changes were produced"
            exit 1
          fi
          git commit -m "migrate Image Studio to generation lifecycle"
          git push origin HEAD:${{ github.ref_name }}
