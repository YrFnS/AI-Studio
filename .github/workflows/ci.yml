name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-generation-registry:
    name: Apply registry adapter and selector migration
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/p0-runtime-integrity' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out registry branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-runtime-integrity
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Apply registry migration
        run: |
          node scripts/apply-generation-registry-ui-migration.mjs
          node scripts/apply-generation-registry-ui-followup.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build standalone app
        run: bun run build:app

      - name: Commit registry migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/api/generate/handlers.ts \
            src/components/studio/image-studio.tsx \
            src/components/studio/video-studio.tsx \
            src/components/studio/cinema-studio.tsx
          if git diff --cached --quiet; then
            echo "No registry migration changes were produced"
            exit 1
          fi
          git commit -m "enforce generation registry in adapters and selectors"
          git push origin HEAD:agent/p0-runtime-integrity

  validate:
    name: Typecheck, test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build standalone app
        run: bun run build:app
